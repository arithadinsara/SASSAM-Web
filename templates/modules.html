{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules Page</title>
    <link rel="stylesheet" href="{% static 'css/modules.css' %}">
</head>
<body>
    <div class="container">
        <h1>Modules for {{ program }} - {{ batch }} - {{ semester }}</h1>
        <div id="modules" class="modules">
            {% for module in modules %}
                <div class="module-card">
                    <h2>{{ module.name }}</h2>
                    <p>{{ module.description }}</p>
                    <form method="POST" action="{% url 'qr_page' %}">
                        {% csrf_token %}
                        <input type="hidden" name="moduleName" value="{{ module.name }}">
                        <input type="hidden" name="lecturerName" value="Lecturer Name">  <!-- Replace with dynamic value if available -->
                        <button type="submit">Generate QR Code</button>
                    </form>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
