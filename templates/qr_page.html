<!DOCTYPE html>
<html lang="en">

<head>
    <title>QR Generator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<style>
    @keyframes gradient {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
    }
    
    .animate-gradient {
        animation: gradient 15s ease infinite;
        background-size: 400% 400%;
    }
    
    @keyframes wave {
        0%, 100% { transform: translateX(1); }
        25% { transform: translateX(-25%); }
        50% { transform: translateX(-50%); }
        75% { transform: translateX(-25%); }
    }
    
    .animate-wave {
        animation: wave 10s -3s linear infinite;
    }
    
    .animate-wave.reverse {
        animation: wave 18s linear reverse infinite;
    }
    </style>

<body class="flex flex-col min-h-screen overflow-x-hidden bg-fixed bg-gradient-to-r from-purple-900 via-purple-400 to-purple-800 animate-gradient">
    <!-- Wave Animation -->
    <div class="fixed bottom-0 left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-60 animate-wave z-[-1]"></div>
    <div class="fixed bottom-[-1.25em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-70 animate-wave reverse z-[-1]"></div>
    <div class="fixed bottom-[-2.5em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-80 animate-wave reverse z-[-1]"></div>
    <div class="fixed bottom-[-2.5em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-90 animate-wave reverse z-[-1]"></div>

    <!-- Navbar -->
    <nav class="flex items-center justify-between w-full h-20 px-10 shadow-md bg-white/20">
        <img src="https://lnbti.lk/wp-content/themes/lnbti-theme-child/images/logonew.png" alt="LNBTI Logo" class="pl-2 h-14">
        
    </nav>

    <!-- Form Content -->
    <div class="flex items-center justify-center flex-grow">
        <div class="w-full p-8 mx-auto rounded-lg shadow-lg bg-slate-300/55 md:w-1/2 lg:w-1/3 backdrop-blur-md">
            <div class="flex justify-between">
                <div>
                    <div class="mb-4">
                        <label for="lecText" class="block mb-2 text-lg font-semibold text-black">Enter lecturer name</label>
                        <input type="text" id="lecText" placeholder="Lecturer name" class="w-full px-4 py-2 text-gray-900 rounded shadow focus:outline-none">
                    </div>
                    <div class="mb-4">
                        <label for="courseText" class="block mb-2 text-lg font-semibold text-black">Enter course name</label>
                        <input type="text" id="courseText" placeholder="Course name" class="w-full px-4 py-2 text-gray-900 rounded shadow focus:outline-none ">
                    </div>
                    <div class="mb-4">
                        <label for="timeText" class="block mb-2 text-lg font-semibold text-black">Enter time</label>
                        <input type="time" id="timeText" placeholder="Lecture time" class="w-full px-4 py-2 text-gray-900 rounded shadow focus:outline-none">
                    </div>
                    <div class="mb-4">
                        <label for="dateText" class="block mb-2 text-lg font-semibold text-black">Enter date</label>
                        <input type="date" id="dateText" placeholder="Date" class="w-full px-4 py-2 text-gray-900 rounded shadow focus:outline-none">
                    </div>
                </div>
                <div id="imgBox" class="hidden w-1/2 ml-4 border border-gray-300 rounded">
                    <img src="" id="qrImage" class="w-full h-auto p-2">
                </div>
            </div>
            <div class="flex justify-between w-full gap-2 mt-2">
                <button class="flex items-center justify-center w-full h-12 font-semibold text-black bg-white border-0 rounded-lg shadow-md cursor-pointer hover:bg-purple-800 hover:text-white">
                    <span class="mr-2">Generate QR</span>
                </button>
                <button class="flex items-center justify-center w-full h-12 font-semibold text-black bg-white border-0 rounded-lg shadow-md cursor-pointer hover:bg-purple-800 hover:text-white"">
                    <img src="download.jpeg" alt="Download" class="mr-2 w-7 h-7"> Download
                </button>
                <button class="flex items-center justify-center w-full h-12 font-semibold text-black bg-white border-0 rounded-lg shadow-md cursor-pointer hover:bg-purple-800 hover:text-white"">
                    <img src="share.jpeg" alt="Share" class="mr-2 w-7 h-7"> Share
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="w-full py-4 mt-auto text-center text-white bg-white/20 footer">
        <p>&copy; 2024 LNBTI Japanese IT University. BIO-METRIC ATTENDANCE All rights reserved.</p>
        <p>Design and Development by LNBTI</p>
    </div>

    <script>
        let imgBox = document.getElementById("imgBox");
        let qrImage = document.getElementById("qrImage");
        let lecText = document.getElementById("lecText");
        let timeText = document.getElementById("timeText");
        let courseText = document.getElementById("courseText");
        let dateText = document.getElementById("dateText");

        function generateQR() {
            if (lecText.value.length > 0 && timeText.value.length > 0 && courseText.value.length > 0 && dateText.value.length > 0) {
                let data = `Lecturer: ${lecText.value}, Course: ${courseText.value}, Time: ${timeText.value}, Date: ${dateText.value}`;
                qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(data);
                imgBox.classList.remove("hidden");
            }
        }

        function downloadQR() {
            if (qrImage.src) {
                const imageName = prompt("Enter a Course name for the QR code image:", "QRCode");
                if (imageName) {
                    fetch(qrImage.src)
                        .then(response => response.blob())
                        .then(blob => {
                            const link = document.createElement('a');
                            link.href = URL.createObjectURL(blob);
                            link.download = imageName + '.png';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(link.href);
                        })
                        .catch(err => console.error('Error fetching the image:', err));
                }
            }
        }

        function shareQR() {
            if (qrImage && qrImage.src) {
                const qrImageUrl = qrImage.src;
                const whatsappUrl = `https://wa.me/?text=Check out this QR code: ${qrImageUrl}`;
                window.open(whatsappUrl, '_blank');
                const mailUrl = `mailto:?subject=QR Code&body=Check out this QR code: ${qrImageUrl}`;
                window.open(mailUrl, '_blank');
            }
        }
    </script>
</body>

</html>
