<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="./output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
      @keyframes gradient {
          0% { background-position: 0% 0%; }
          50% { background-position: 100% 100%; }
          100% { background-position: 0% 0%; }
      }
      
      .animate-gradient {
          animation: gradient 15s ease infinite;
          background-size: 400% 400%;
      }
      
      @keyframes wave {
          0%, 100% { transform: translateX(1); }
          25% { transform: translateX(-25%); }
          50% { transform: translateX(-50%); }
          75% { transform: translateX(-25%); }
      }
      
      .animate-wave {
          animation: wave 10s -3s linear infinite;
      }
      
      .animate-wave.reverse {
          animation: wave 18s linear reverse infinite;
      }
      
      /* Custom CSS to control the canvas size */
      #myChart {
        width: 800px; /* Adjust width */
        height: 600px; /* Adjust height */
      }
    </style>
</head>

<body class="flex flex-col items-center min-h-screen overflow-x-hidden bg-fixed bg-gradient-to-r from-purple-900 via-purple-400 to-purple-800 animate-gradient">
    <!-- Wave Animation -->
    <div class="fixed bottom-0 left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-60 animate-wave z-[-1]"></div>
    <div class="fixed bottom-[-1.25em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-70 animate-wave reverse z-[-1]"></div>
    <div class="fixed bottom-[-2.5em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-80 animate-wave reverse z-[-1]"></div>
    <div class="fixed bottom-[-2.5em] left-0 w-[200%] h-60 bg-white/25 rounded-[1000%_1000%_0_0] opacity-90 animate-wave reverse z-[-1]"></div>

    <!-- Navbar -->
    <nav class="flex items-center justify-between w-full h-20 px-10 shadow-md bg-white/20">
        <img src="https://lnbti.lk/wp-content/themes/lnbti-theme-child/images/logonew.png" alt="LNBTI Logo" class="h-14">
    </nav>

    <!-- Chart -->
    <div class="flex justify-center mt-10">
      <canvas id="myChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      const ctx = document.getElementById('myChart');

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Safiuddeen', 'Tharuka', 'Aritha', 'Nehan','Maleesha'],
          datasets: [{
            label: 'Attendance Percentage',
            data: [100, 10, 100, 70,50],
            backgroundColor: '#6b21a8', // Background color of bars
            borderColor: 'rgba(255, 255, 255, 4)', // Border color of bars
            borderWidth: 2
          }]
        },
        options: {
          plugins: {
            legend: {
              labels: {
                color: 'white', // Color of the legend labels
                font: {
                  weight: 'bold' // Font weight of the legend labels
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: 'white', // Color of the x-axis labels
                font: {
                  weight: 'bold' // Font weight of the x-axis labels
                }
              }
            },
            y: {
              ticks: {
                color: 'white', // Color of the y-axis labels
                font: {
                  weight: 'bold' // Font weight of the y-axis labels
                }
              }
            }
          }
        }
      });
    </script>
</body>

</html>
